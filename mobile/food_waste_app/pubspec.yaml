name: food_waste_app
description: "EcoGrab Flutter Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.1

dependency_overrides:
  google_maps_flutter_android: 2.14.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ecograb_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/